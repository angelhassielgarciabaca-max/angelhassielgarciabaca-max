<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a12"/><stop offset="1" stop-color="#0b1a14"/></linearGradient>
<linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff66" stop-opacity=".35"/><stop offset="1" stop-color="#00ff66" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00ff66" stroke-opacity=".06"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.t{font-family:'Courier New',Consolas,monospace;white-space:pre}
.dim{font-size:11px;fill:#00ff66;fill-opacity:.55}
.lbl{font-size:12px;fill:#c9d1d9}
.g{fill:#00ff66}.c{fill:#00e5ff}.a{fill:#ffb000}
.kv{font-size:20px;font-weight:700}
.draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 3.5s ease-out forwards}
.pulse{animation:pulse 2s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s ease-in-out infinite alternate}
.flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}
.scan{animation:scan 5s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{from{transform:scaleX(.55)}to{transform:scaleX(1)}}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(380px)}}
@keyframes gauge{from{stroke-dashoffset:220}}
</style>
