<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#0b1a14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00ff66" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <style>
    .t{font-family:'Courier New',Consolas,monospace;white-space:pre}
    .art{font-size:19px;font-weight:700;fill:#00ff66;opacity:0;animation:in .5s forwards,hue 6s linear infinite}
    .l1{animation-delay:.3s,.3s}.l2{animation-delay:.6s,.6s}.l3{animation-delay:.9s,.9s}
    .l4{animation-delay:1.2s,1.2s}.l5{animation-delay:1.5s,1.5s}.l6{animation-delay:1.8s,1.8s}
    .sub{font-size:15px;fill:#00e5ff}
    .dim{font-size:12px;fill:#00ff66;fill-opacity:.55}
    .cur{fill:#00ff66;animation:blink 1s steps(1) infinite}
    .scan{animation:scan 4s linear infinite}
    @keyframes in{to{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes hue{0%{fill:#00ff66}33%{fill:#00e5ff}66%{fill:#ffb000}100%{fill:#00ff66}}
    @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(350px)}}
    @keyframes bits{from{opacity:.15}50%{opacity:.6}to{opacity:.15}}
    .b{animation:bits 3s ease-in-out infinite}
  </style>
  <rect width="900" height="330" rx="12" fill="url(#bg)"/>
  <rect width="900" height="330" rx="12" fill="url(#grid)"/>
  <rect width="900" height="330" rx="12" fill="none" stroke="#00ff66" stroke-opacity=".5"/>
  <!-- barra de ventana -->
  <rect width="900" height="30" rx="12" fill="#0d1420"/>
  <circle cx="22" cy="15" r="6" fill="#ff5f56"/><circle cx="42" cy="15" r="6" fill="#ffbd2e"/><circle cx="62" cy="15" r="6" fill="#27c93f"/>
  <text x="450" y="19" text-anchor="middle" class="t dim">hassiel@quant-lab: ~/profile</text>

  <text x="30" y="62" class="t dim">$ whoami</text>

  <g filter="url(#glow)">
    <text x="450" y="105" text-anchor="middle" class="t art l1">██╗  ██╗ █████╗ ███████╗███████╗██╗███████╗██╗     </text>
    <text x="450" y="128" text-anchor="middle" class="t art l2">██║  ██║██╔══██╗██╔════╝██╔════╝██║██╔════╝██║     </text>
    <text x="450" y="151" text-anchor="middle" class="t art l3">███████║███████║███████╗███████╗██║█████╗  ██║     </text>
    <text x="450" y="174" text-anchor="middle" class="t art l4">██╔══██║██╔══██║╚════██║╚════██║██║██╔══╝  ██║     </text>
    <text x="450" y="197" text-anchor="middle" class="t art l5">██║  ██║██║  ██║███████║███████║██║███████╗███████╗</text>
    <text x="450" y="220" text-anchor="middle" class="t art l6">╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝╚══════╝╚═╝╚══════╝╚══════╝</text>
  </g>

  <text x="450" y="262" text-anchor="middle" class="t sub">[ QUANTITATIVE ANALYST · FINANCIAL ECONOMETRICS · ALGO TRADING ]</text>
  <text x="30" y="305" class="t dim">$ ./run --profile</text>
  <rect class="cur" x="175" y="293" width="9" height="15"/>

  <text x="760" y="62" class="t dim b">10110101 01100011</text>
  <text x="760" y="305" class="t dim b" style="animation-delay:1.5s">01110011 01001000</text>

  <rect class="scan" x="0" y="0" width="900" height="14" fill="#00ff66" fill-opacity=".05"/>
</svg>
